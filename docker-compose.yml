services:
  web:
    image: azericard-reporting:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # baked into the JS bundle at build time
        VITE_APP_API: ${VITE_APP_API:-/api/}
        VITE_PERSIST_KEY: ${VITE_PERSIST_KEY:?set VITE_PERSIST_KEY in .env}
        VITE_CARTO_BASEMAP_KEY: ${VITE_CARTO_BASEMAP_KEY:-}
    container_name: azericard-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    environment:
      # read at container start by nginx (no rebuild needed to change)
      API_UPSTREAM: ${API_UPSTREAM:-http://31.57.77.199:8080}
      SERVER_NAME: ${SERVER_NAME:-_}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
